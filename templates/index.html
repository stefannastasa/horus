<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="10">
    <title>horus</title>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
        h1 { font-size: 1.2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #8883; }
        th { font-weight: 600; opacity: 0.6; font-size: 0.8rem; text-transform: uppercase; }
        .running { color: #2e7d32; }
        .stopped { color: #c62828; }
        footer { margin-top: 2rem; opacity: 0.5; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>horus &mdash; {{ containers.len() }} containers</h1>

    <table>
        <thead>
            <tr><th>name</th><th>image</th><th>state</th><th>status</th></tr>
        </thead>
        <tbody>
        {% for c in containers %}
            <tr>
                <td>{{ c.name }}</td>
                <td>{{ c.image }}</td>
                <td class="{% if c.state.is_running() %}running{% else %}stopped{% endif %}">{{ c.state }}</td>
                <td>{{ c.status }}</td>
            </tr>
        {% else %}
            <tr><td colspan="4">no containers</td></tr>
        {% endfor %}
        </tbody>
    </table>

    <footer>auto-refreshes every 10s</footer>
</body>
</html>
